name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest

      # Applies the migrations to a throwaway SQLite file, then fails if the
      # models and the migrations have drifted apart.
      - name: Apply migrations
        run: alembic upgrade head

      - name: Check for model/migration drift
        run: alembic check

      # Boots uvicorn on its own database and drives it over real HTTP and a
      # real WebSocket. Covers the socket handshake, the ASGI server and the
      # lifespan wiring, none of which the in-process test client exercises.
      - name: End-to-end smoke test
        run: python -m scripts.smoke_e2e

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
